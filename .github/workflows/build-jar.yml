name: Build legado-web jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build
          ls -lh dist

      - name: Copy dist into server resources
        run: |
          rm -rf server/src/main/resources/static
          mkdir -p server/src/main/resources/static
          cp -r web/dist/. server/src/main/resources/static/
          ls server/src/main/resources/static | head

      - name: Build fat jar
        run: |
          chmod +x gradlew
          ./gradlew :server:buildFatJar -PwithWeb -x buildWeb --no-daemon

      - name: Show artifacts
        run: ls -lh server/build/libs/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-web-jar
          path: server/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jar-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" server/build/libs/*.jar \
            --title "legado-web jar $TAG" \
            --notes "Automated build from ${{ github.sha }}"
          echo "RELEASE_TAG=$TAG"
